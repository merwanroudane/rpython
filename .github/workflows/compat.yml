name: Scheduled compatibility

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC: catch upstream breakage early
  workflow_dispatch:

jobs:
  latest-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release, use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-package
          extra-packages: any::arrow, any::data.table, any::Matrix, any::xts, any::haven, any::survival, any::sf, any::igraph, any::plm, any::duckdb, any::RSQLite, any::dbplyr, any::dplyr, any::ggplot2
      - run: pip install -e ".[dev]" --upgrade --upgrade-strategy eager
      - run: python -m pytest tests/roundtrip tests/integration tests/economics -q
        env: { PYTHONIOENCODING: utf-8 }
