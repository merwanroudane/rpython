name: Notebook smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  colab-like:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release, use-public-rspm: true }
      - run: Rscript -e 'install.packages(c("jsonlite", "arrow"))'
      - run: pip install -e ".[arrow,notebook]" nbconvert nbformat ipykernel
      - name: execute the Colab quickstart notebook from a fresh runtime
        run: jupyter nbconvert --to notebook --execute notebooks/colab_quickstart.ipynb --output executed.ipynb --ExecutePreprocessor.timeout=900
        env: { PYTHONIOENCODING: utf-8 }
